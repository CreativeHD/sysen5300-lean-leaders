name: Validate CivicWatch Change

# Non-deploying checks. Frontend deployment remains strictly manual.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test, lint and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify statistical engine and HTTP API
        run: |
          python -m pip install -r app/requirements-dev.txt
          python -m pytest tests app/test_app.py -q
